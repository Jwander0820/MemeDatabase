<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私人管理｜動畫梗圖館</title>
  <link rel="stylesheet" href="/static/catalog.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="app-shell">
    <aside class="rail" aria-label="搜尋與篩選">
      <div class="brand">
        <div class="brand-mark">AM</div>
        <div>
          <span class="mode-name">私人管理</span>
          <h1>動畫梗圖館</h1>
          <p id="resultCount">載入中</p>
        </div>
      </div>

      <button id="openCreate" class="create-button primary" type="button">
        <span aria-hidden="true">＋</span>
        手動新增梗圖
      </button>

      <button id="openPublication" type="button">發布管理</button>
      <label class="field">
        <span>搜尋</span>
        <input id="searchInput" type="search" placeholder="台詞、作品、說話者、OCR">
      </label>

      <div class="field-grid">
        <label class="field">
          <span>狀態</span>
          <select id="statusFilter">
            <option value="ready">ready</option>
            <option value="ignored">ignored</option>
            <option value="all">全部</option>
          </select>
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sortFilter">
            <option value="updated">最近更新</option>
            <option value="source_new">來源新到舊</option>
            <option value="source_old">來源舊到新</option>
            <option value="title">作品</option>
            <option value="random">隨機瀏覽</option>
          </select>
        </label>
      </div>

      <div class="toggles">
        <label><input id="favoriteOnly" type="checkbox"> 收藏</label>
        <label><input id="missingImage" type="checkbox"> 缺圖片</label>
        <label><input id="noTags" type="checkbox"> 無標籤</label>
      </div>

      <section class="tag-panel">
        <div class="panel-heading">
          <span>標籤</span>
          <button id="clearTag" type="button">清除</button>
        </div>
        <div id="tagList" class="tag-list"></div>
      </section>
    </aside>

    <section class="content">
      <div id="grid" class="meme-grid" aria-live="polite"></div>
      <div class="load-row">
        <button id="loadMore" type="button">載入更多</button>
      </div>
    </section>
  </main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-bar">
      <button id="closeDrawer" type="button" aria-label="關閉">×</button>
      <button id="favoriteButton" type="button">☆</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <dialog id="createDialog" class="create-dialog" aria-labelledby="createTitle">
    <form id="createForm" class="create-form" enctype="multipart/form-data">
      <div class="create-header">
        <div>
          <p class="create-kicker">MANUAL ARCHIVE</p>
          <h2 id="createTitle">手動新增梗圖</h2>
          <p>圖片會存入本機館藏，之後可沿用 R2 與 Notion 匯出流程。</p>
        </div>
        <button id="closeCreate" class="icon-button" type="button" aria-label="關閉">×</button>
      </div>

      <label class="upload-field" for="createImage">
        <input id="createImage" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
        <img id="createPreview" alt="圖片預覽">
        <span class="upload-copy">
          <strong>選擇梗圖圖片</strong>
          <small>JPG、PNG、WebP 或 GIF，最大 50 MB</small>
        </span>
      </label>

      <div class="create-fields">
        <label class="field"><span>作品名稱</span><input name="anime_title" autocomplete="off"></label>
        <label class="field"><span>說話者</span><input name="speaker" autocomplete="off"></label>
        <label class="field create-wide"><span>圖片台詞</span><textarea name="quote_text" placeholder="輸入圖片中的主要台詞"></textarea></label>
        <label class="field create-wide"><span>標籤（逗號分隔）</span><input name="tags" placeholder="吐槽, 名場面"></label>
        <label class="field"><span>狀態</span>
          <select name="status">
            <option value="ready">ready</option>
            <option value="needs_review">needs_review</option>
            <option value="ignored">ignored</option>
          </select>
        </label>
        <label class="field create-wide"><span>備註</span><textarea name="notes" placeholder="選填，例如圖片來源或待確認事項"></textarea></label>
      </div>

      <div id="createError" class="form-error" role="alert" aria-live="polite"></div>
      <div class="create-actions">
        <button id="cancelCreate" type="button">取消</button>
        <button id="saveCreate" class="primary" type="submit">新增至資料庫</button>
      </div>
    </form>
  </dialog>

  <dialog id="publicationDialog" class="create-dialog" aria-labelledby="publicationTitle">
    <section class="create-form">
      <div class="create-header"><h2 id="publicationTitle">發布管理</h2>
        <form method="dialog"><button autofocus>關閉</button></form>
      </div>
      <div class="edit-actions">
        <button id="checkPublication">檢查</button>
        <button id="exportPublication" disabled>匯出</button>
        <button id="activatePublication" class="primary" disabled>啟用此版</button>
      </div>
      <p id="publicationStatus" role="status"></p>
      <div id="publicationReport"></div>
    </section>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/publication.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
