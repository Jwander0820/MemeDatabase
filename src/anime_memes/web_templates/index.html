<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私人管理｜迷因資料庫</title>
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/static/catalog.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <svg class="svg-sprite" width="0" height="0" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></symbol>
  </svg>
  <main class="app-shell">
    <aside class="rail" aria-label="搜尋與篩選">
      <div class="brand">
        <img class="brand-mark" src="/static/favicon.svg" alt="" width="44" height="44" aria-hidden="true">
        <div class="brand-text">
          <h1>迷因資料庫</h1>
        </div>
        <button id="themeToggle" class="icon-button ghost theme-toggle" type="button" aria-label="切換深淺色模式"><svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
      </div>

      <div class="rail-actions">
        <button id="openCreate" class="create-button primary" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          新增梗圖
        </button>
        <button id="openPublication" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
          發布管理
        </button>
      </div>

      <label class="field">
        <span>搜尋</span>
        <span class="search-box">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="台詞、作品、角色、標籤" autocomplete="off">
        </span>
      </label>
      <fieldset class="toggles search-scope" id="searchScope">
        <legend class="section-label">搜尋範圍</legend>
        <label class="check-chip"><input type="radio" name="searchField" value="" checked><span>不限</span></label>
        <label class="check-chip"><input type="radio" name="searchField" value="work"><span>作品</span></label>
        <label class="check-chip"><input type="radio" name="searchField" value="speaker"><span>角色</span></label>
        <label class="check-chip"><input type="radio" name="searchField" value="quote"><span>台詞</span></label>
      </fieldset>

      <div class="field-grid">
        <label class="field">
          <span>狀態</span>
          <select id="statusFilter">
            <option value="ready">可用</option>
            <option value="needs_review">待審核</option>
            <option value="ignored">已忽略</option>
            <option value="all">全部</option>
          </select>
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sortFilter">
            <option value="updated">最近更新</option>
            <option value="source_new">來源新到舊</option>
            <option value="source_old">來源舊到新</option>
            <option value="title">作品</option>
            <option value="random">隨機瀏覽</option>
          </select>
        </label>
      </div>

      <fieldset class="toggles">
        <legend class="section-label">快速篩選</legend>
        <label class="check-chip"><input id="needsReviewOnly" type="checkbox"><span>待審核<small id="needsReviewCount" class="chip-count" hidden></small></span></label>
        <label class="check-chip" title="有 AI／Agent 候選標籤等待審核的梗圖，不分狀態；勾選時狀態會改為「全部」"><input id="pendingSuggestions" type="checkbox"><span>候選標籤待處理<small id="pendingSuggestionsCount" class="chip-count" hidden></small></span></label>
        <label class="check-chip"><input id="favoriteOnly" type="checkbox"><span>★ 收藏</span></label>
        <label class="check-chip"><input id="missingImage" type="checkbox"><span>缺圖片</span></label>
        <label class="check-chip"><input id="noTags" type="checkbox"><span>無標籤</span></label>
        <label class="check-chip"><input id="publishedOnly" type="checkbox"><span>已公開</span></label>
        <label class="check-chip"><input id="unpublishedOnly" type="checkbox"><span>未公開</span></label>
      </fieldset>

      <section class="tag-panel">
        <div class="panel-heading">
          <span class="section-label">標籤</span>
          <button id="clearTag" class="ghost" type="button">清除</button>
        </div>
        <div id="tagList" class="tag-list"></div>
      </section>
    </aside>

    <section class="content">
      <header class="content-head">
        <h2>館藏</h2>
        <p id="resultCount" role="status">載入中</p>
        <button id="selectMode" class="view-switch" type="button" aria-pressed="false">多選</button>
        <a class="view-switch" href="/browse">簡潔瀏覽</a>
      </header>
      <div id="grid" class="meme-grid" aria-live="polite"></div>
      <div class="load-row">
        <button id="loadMore" type="button">載入更多</button>
        <span id="loadEnd" class="load-end" hidden>已經到底了</span>
      </div>
      <div id="bulkBar" class="bulk-bar" role="region" aria-label="批次操作" hidden>
        <strong id="bulkCount" role="status">已選 0 張</strong>
        <button id="bulkSelectAll" class="ghost" type="button">全選目前篩選結果</button>
        <button id="bulkClear" class="ghost" type="button">清除選取</button>
        <span class="spacer"></span>
        <button id="bulkUnpublish" type="button">取消公開</button>
        <button id="bulkPublish" class="primary" type="button">設為公開</button>
      </div>
    </section>
  </main>

  <aside id="drawer" class="drawer" role="dialog" aria-hidden="true" aria-label="梗圖詳情">
    <div class="drawer-bar">
      <button id="closeDrawer" class="icon-button ghost" type="button" aria-label="關閉">×</button>
      <strong class="drawer-title">梗圖詳情</strong>
      <button id="favoriteButton" class="icon-button favorite-button" type="button" aria-label="收藏">☆</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim" aria-hidden="true"></div>

  <dialog id="createDialog" class="create-dialog" aria-labelledby="createTitle">
    <form id="createForm" class="create-form" enctype="multipart/form-data">
      <div class="create-header">
        <div>
          <p class="create-kicker">手動建檔</p>
          <h2 id="createTitle">新增梗圖</h2>
          <p>圖片會存入本機館藏，之後可沿用 R2 與 Notion 匯出流程。</p>
        </div>
        <button id="closeCreate" class="icon-button ghost" type="button" aria-label="關閉">×</button>
      </div>

      <label class="upload-field" for="createImage">
        <input id="createImage" name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required>
        <img id="createPreview" alt="圖片預覽">
        <span class="upload-icon" aria-hidden="true"><svg class="icon"><use href="#i-image"/></svg></span>
        <span class="upload-copy">
          <strong>選擇梗圖圖片</strong>
          <small>JPG、PNG、WebP 或 GIF，最大 50 MB</small>
        </span>
      </label>

      <div class="create-fields">
        <label class="field"><span>作品名稱</span><input name="anime_title" autocomplete="off"></label>
        <label class="field"><span>圖片出處（選填）</span><input type="url" name="source_page" placeholder="https://"></label>
        <label class="field"><span>說話者</span><input name="speaker" autocomplete="off"></label>
        <label class="field create-wide"><span>圖片台詞</span><textarea name="quote_text" placeholder="輸入圖片中的主要台詞"></textarea></label>
        <label class="field"><span>標籤</span><input name="tags"></label>
        <label class="field"><span>狀態</span>
          <select name="status">
            <option value="ready">可用</option>
            <option value="needs_review">待審核</option>
            <option value="ignored">已忽略</option>
          </select>
        </label>
        <label class="field create-wide"><span>備註</span><textarea name="notes" placeholder="選填，例如圖片來源或待確認事項"></textarea></label>
      </div>

      <div id="createError" class="form-error" role="alert" aria-live="polite"></div>
      <div class="create-actions">
        <button id="cancelCreate" type="button">取消</button>
        <button id="saveCreate" class="primary" type="submit">新增至資料庫</button>
      </div>
    </form>
  </dialog>

  <dialog id="publicationDialog" class="create-dialog" aria-labelledby="publicationTitle">
    <section class="create-form">
      <div class="create-header">
        <div>
          <p class="create-kicker">公開館藏</p>
          <h2 id="publicationTitle">發布管理</h2>
          <p>依序檢查、匯出新版本，再啟用讓公開頁切換到這一版。</p>
        </div>
        <form method="dialog"><button class="icon-button ghost" aria-label="關閉" autofocus>×</button></form>
      </div>
      <div class="publication-steps">
        <button id="checkPublication"><span class="step-no">1</span>檢查</button>
        <button id="exportPublication" disabled><span class="step-no">2</span>匯出</button>
        <button id="activatePublication" class="primary" disabled><span class="step-no">3</span>啟用此版</button>
      </div>
      <p id="publicationStatus" role="status"></p>
      <div id="publicationReport"></div>
      <details class="purge-panel">
        <summary>徹底清除舊版本與已撤回的圖片</summary>
        <p>取消公開並啟用新版後，被撤回的圖仍可能留在舊版本、舊縮圖與 R2 上。這裡會刪除目前啟用版本以外的所有舊版本、只被它們使用的縮圖，以及不再需要的 R2 大圖。刪除後無法退回舊版本。</p>
        <div class="publication-steps purge-steps">
          <button id="previewPurge" type="button">預覽清除內容</button>
          <button id="runPurge" class="danger" type="button" disabled>確認清除</button>
        </div>
        <div id="purgeReport" role="status"></div>
      </details>
    </section>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/publication.js"></script>
  <script src="/assets/infinite-scroll.js"></script>
  <script src="/assets/masonry.js"></script>
  <script src="/static/tag-input.js"></script>
  <script src="/static/app-utils.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/app-bulk.js"></script>
  <script src="/static/app-detail.js"></script>
  <script src="/static/app-create.js"></script>
  <script src="/static/app-init.js"></script>
</body>
</html>
