<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>迷因資料庫</title>
  <meta name="description" content="搜尋台詞、作品、角色與標籤，快速找到想用的梗圖。">
  <meta name="theme-color" content="#f3f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      const root = document.documentElement;
      const media = matchMedia("(prefers-color-scheme: dark)");
      try {
        const saved = localStorage.getItem("meme-db-theme");
        if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      } catch {}
      const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : media.matches;
      addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById("themeToggle");
        const sync = () => {
          const dark = isDark();
          button.setAttribute("aria-pressed", String(dark));
          button.title = dark ? "切換為淺色模式" : "切換為深色模式";
          button.setAttribute("aria-label", button.title);
          // 手動切換後讓手機瀏覽器網址列顏色一起改變。
          document.querySelectorAll('meta[name="theme-color"]').forEach(meta => {
            meta.content = dark ? "#0f0f11" : "#f3f2ee";
          });
        };
        button.addEventListener("click", () => {
          root.dataset.theme = isDark() ? "light" : "dark";
          try { localStorage.setItem("meme-db-theme", root.dataset.theme); } catch {}
          sync();
        });
        media.addEventListener("change", sync);
        sync();
      });
    })();
  </script>
  <link rel="stylesheet" href="/assets/catalog.css">
  <link rel="stylesheet" href="/assets/gallery.css">
  <script defer src="/assets/masonry.js"></script>
  <script defer src="/assets/gallery.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" id="home" href="/" aria-label="迷因資料庫首頁">
        <span class="brand-mark" aria-hidden="true">迷</span>
        <div class="brand-text"><h1>迷因資料庫</h1></div>
      </a>
      <form id="filters" class="search-form" role="search">
        <label class="search-box">
          <span class="sr-only">搜尋</span>
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="query" type="search" maxlength="256" placeholder="搜尋台詞、作品、角色或標籤" autocomplete="off" enterkeyhint="search">
        </label>
        <label class="sort-select">
          <span class="sr-only">排序</span>
          <select id="sort"><option value="">自動排序</option><option value="relevance">相關度</option><option value="updated">最近更新</option><option value="title">作品名稱</option></select>
        </label>
        <button class="primary search-submit">搜尋</button>
      </form>
      <a id="adminLink" class="admin-link" href="/" hidden>管理</a>
      <button id="themeToggle" class="icon-button ghost theme-toggle" type="button" aria-label="切換深淺色模式"><svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
    </div>
    <nav class="tag-strip" aria-label="依標籤篩選">
      <div class="tag-row" id="tags"></div>
    </nav>
  </header>
  <main class="content" aria-label="搜尋結果">
    <div class="results-head">
      <p id="status" role="status"></p>
    </div>
    <div class="meme-grid" id="results"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-mark" aria-hidden="true">?</div>
      <strong id="emptyTitle">找不到符合的梗圖</strong>
      <p id="emptyHint">換個關鍵字，或試試其他標籤。</p>
    </div>
    <div class="load-row"><button id="more" hidden>載入更多</button></div>
  </main>
  <footer class="site-footer">迷因資料庫 · 圖片版權屬原作者所有</footer>
  <dialog class="viewer" id="preview" aria-labelledby="title">
    <form method="dialog" class="viewer-close"><button class="icon-button" aria-label="關閉" autofocus><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></form>
    <div class="viewer-layout">
      <figure class="viewer-media" id="media"></figure>
      <section class="viewer-info">
        <h2 id="title">梗圖詳情</h2>
        <div id="detail"></div>
        <p id="feedback" role="status"></p>
      </section>
    </div>
  </dialog>
</body>
</html>
