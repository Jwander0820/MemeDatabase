# 固定專案名稱：映像名稱一律是 memedatabase-<服務>，不受資料夾名稱影響（scripts/push_release.ps1 依此預設映像名）。
# 測試以 -p 指定其他專案名稱時，映像與容器名稱各自獨立，不會覆蓋正在使用的映像。
name: memedatabase

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"
  security_opt: ["no-new-privileges:true"]
  # 所有服務都不需要任何 Linux capability：Nginx 監聽 8080（非特權 port、UID 101），Python 服務為 UID 10001，cloudflared 只連出。
  cap_drop: [ALL]

# Nginx 唯讀根檔案系統下的可寫位置（實測最小集合）：
#   /tmp                 pid 檔與 proxy／client body 暫存
#   /etc/nginx/conf.d    entrypoint 以 envsubst 把 templates 渲染到這裡（需 UID 101 可寫）
x-nginx-tmpfs: &nginx-tmpfs
  - /tmp
  - /etc/nginx/conf.d:uid=101,gid=101,mode=0755

services:
  public-api:
    <<: *common
    profiles: [public]
    build: {context: ., target: public}
    environment:
      MEMES_RELEASE_ROOT: /releases
    volumes:
      # 目錄不存在時直接失敗，不讓 Docker 自動建立 root 擁有的目錄（之後 UID 10001 無法安裝發布包）。
      # Linux Docker Engine 會遵守；Docker Desktop 可能仍自動建立，部署時一律先建立目錄並 chown（docs/vps-deployment.md）。
      - type: bind
        source: ${RELEASE_ROOT:-./data/releases}
        target: /releases
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      # 用 live 而非 ready：首次部署還沒有啟用版本時 ready 是 503，若以它判斷健康，Nginx 會一直等不到而無法啟動。
      # 是否已有啟用版本請另外檢查 /health/ready。
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
  public-nginx:
    <<: *common
    profiles: [public]
    build: {context: ., dockerfile: deploy/Dockerfile.nginx, target: public}
    depends_on:
      public-api: {condition: service_healthy}
    ports: ["127.0.0.1:${PUBLIC_PORT:-3637}:8080"]
    environment:
      SEARCH_RATE: ${SEARCH_RATE:-2r/s}
      SEARCH_BURST: ${SEARCH_BURST:-10}
      NGINX_ENVSUBST_FILTER: SEARCH_
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: ""
    volumes:
      - type: bind
        source: ${RELEASE_ROOT:-./data/releases}/media
        target: /srv/media
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: *nginx-tmpfs
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
  private-api:
    <<: *common
    profiles: [private]
    build: {context: ., target: private}
    environment:
      MEMES_DB: /data/anime_memes.sqlite3
      MEMES_ATTACHMENT_DIR: /data/attachments
      MEMES_THUMBNAIL_DIR: /data/thumbnails
      MEMES_WEB_DIR: /data/web
      MEMES_VPS_SSH_DIR: /deploy-ssh
      MEMES_RELEASE_ROOT: /releases
      MEMES_R2_ACCOUNT_ID: ${MEMES_R2_ACCOUNT_ID:-}
      MEMES_R2_ACCESS_KEY_ID: ${MEMES_R2_ACCESS_KEY_ID:-}
      MEMES_R2_SECRET_ACCESS_KEY: ${MEMES_R2_SECRET_ACCESS_KEY:-}
      MEMES_R2_BUCKET: ${MEMES_R2_BUCKET:-}
      MEMES_R2_PUBLIC_BASE_URL: ${MEMES_R2_PUBLIC_BASE_URL:-}
      MEMES_R2_PREFIX: ${MEMES_R2_PREFIX:-}
    volumes:
      - ${PRIVATE_DATA_ROOT:-./data}:/data
      # 僅掛載專用發布金鑰；不暴露整個使用者 ~/.ssh，也不提供 Docker socket。
      - ${PRIVATE_DATA_ROOT:-./data}/deploy-ssh:/deploy-ssh:ro
      - ${RELEASE_ROOT:-./data/releases}:/releases
    # /data 與 /releases 是 bind mount，不受唯讀根檔案系統影響；其餘暫存（Pillow、匯出）都走 /tmp。
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 384m
    pids_limit: 128
    cpus: 1.0
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  private-nginx:
    <<: *common
    profiles: [private]
    build: {context: ., dockerfile: deploy/Dockerfile.nginx, target: private}
    depends_on:
      private-api: {condition: service_healthy}
    ports: ["127.0.0.1:${PRIVATE_PORT:-3636}:8080"]
    volumes:
      - ./deploy/nginx-private.conf.template:/etc/nginx/templates/default.conf.template:ro
    read_only: true
    tmpfs: *nginx-tmpfs
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
  private-mcp:
    <<: *common
    profiles: [mcp]
    build: {context: ., target: mcp}
    environment:
      MEMES_DB: /data/anime_memes.sqlite3
      MEMES_MCP_TOKEN: ${MEMES_MCP_TOKEN:-}
      MEMES_PRIVATE_URL: ${PRIVATE_URL:-http://127.0.0.1:3636}
      MEMES_MCP_BIND: 0.0.0.0
    volumes:
      - ${PRIVATE_DATA_ROOT:-./data}:/data:ro
    ports: ["127.0.0.1:8766:8766"]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 192m
    pids_limit: 128
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8766),timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
  cloudflared:
    # VPS 對外入口：cloudflared 主動連出到 Cloudflare，主機不需開放任何連入 port。
    # Cloudflare 控制台的公開主機名稱指向 http://public-nginx:8080（見 docs/vps-deployment.md）。
    <<: *common
    profiles: [tunnel]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07}
    command: [tunnel, --no-autoupdate, run]
    environment:
      # Tunnel token 是秘密：只放在 VPS 的 .env，不可提交。
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      public-nginx: {condition: service_healthy}
    read_only: true
    mem_limit: 128m
    pids_limit: 128
    cpus: 0.5
