# 每月檢查基底映像、cloudflared 與 GitHub Actions 的新版本並開 PR（保留 digest 鎖定）。
# Python 套件鎖檔由 scripts/lock_dependencies.ps1 產生，不交給 Dependabot。
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
