name: Deploy MemeDatabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memedatabase-production
  cancel-in-progress: false

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-locks/admin-py312-linux.txt
            requirements-locks/mcp-py312-linux.txt
      - name: Install test dependencies
        # 管理端與 MCP 測試需要 Pillow、mcp；沿用 Docker 的 Linux py312 鎖定檔與雜湊。
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/admin-py312-linux.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/mcp-py312-linux.txt
      - name: Run Python unit tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests
  build:
    needs: python-tests
    if: github.repository == 'Jwander0820/MemeDatabase' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.publish.outputs.api_digest }}
      nginx_digest: ${{ steps.publish.outputs.nginx_digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check deployment and gallery
        run: |
          bash -n deploy/vps-code-deploy.sh
          bash -n deploy/vps-publication.sh
          docker compose --profile public --profile tunnel config --quiet
          node --test tests/*.cjs
      - name: Build and publish public images
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for service in api nginx; do
            dockerfile=Dockerfile
            if [[ $service == nginx ]]; then dockerfile=deploy/Dockerfile.nginx; fi
            metadata="$RUNNER_TEMP/memedatabase-$service.json"
            docker buildx build --platform linux/amd64 --file "$dockerfile" --target public \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "ghcr.io/jwander0820/memedatabase-public-$service:sha-$GITHUB_SHA" \
              --metadata-file "$metadata" --push .
            digest=$(jq -er '."containerimage.digest"' "$metadata")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$service" "$digest" >> "$GITHUB_OUTPUT"
          done
  deploy:
    needs: build
    if: vars.VPS_GHCR_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Deploy checked revision via restricted SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          API_DIGEST: ${{ needs.build.outputs.api_digest }}
          NGINX_DIGEST: ${{ needs.build.outputs.nginx_digest }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?}" "${VPS_PORT:?}" "${VPS_USER:?}" "${VPS_SSH_KEY:?}" "${VPS_KNOWN_HOSTS:?}"
          [[ $VPS_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && $VPS_PORT =~ ^[0-9]{1,5}$ && $VPS_USER == ubuntu ]]
          [[ $API_DIGEST =~ ^sha256:[0-9a-f]{64}$ && $NGINX_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -F /dev/null -nT -i "$ssh_dir/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA $API_DIGEST $NGINX_DIGEST"
