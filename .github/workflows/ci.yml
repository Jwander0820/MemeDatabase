name: CI

# PR 時跑測試，不建置映像也不部署；部署仍由 deploy.yml 在 push main 時處理。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Python version from Dockerfile
        # 測試版本以 Dockerfile 基底映像為唯一來源，Dependabot 更新映像時會自動跟著變。
        id: py
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+(\.[0-9]+)?)-.* AS base\r?$/\1/p' Dockerfile)
          test -n "$version" || { echo "Dockerfile 找不到 python base 映像版本" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip
          cache-dependency-path: |
            requirements-locks/admin-linux.txt
            requirements-locks/mcp-linux.txt
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/admin-linux.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/mcp-linux.txt
      - name: Run Python unit tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests
      - name: Check scripts, compose and gallery
        run: |
          bash -n deploy/vps-code-deploy.sh
          bash -n deploy/vps-publication.sh
          docker compose --profile public --profile tunnel config --quiet
          node --test tests/*.cjs
