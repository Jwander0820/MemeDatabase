name: CI

# PR 時跑測試，不建置映像也不部署；部署仍由 deploy.yml 在 push main 時處理。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-locks/admin-py312-linux.txt
            requirements-locks/mcp-py312-linux.txt
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/admin-py312-linux.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-locks/mcp-py312-linux.txt
      - name: Run Python unit tests
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests
      - name: Check scripts, compose and gallery
        run: |
          bash -n deploy/vps-code-deploy.sh
          bash -n deploy/vps-publication.sh
          docker compose --profile public --profile tunnel config --quiet
          node --test tests/*.cjs
