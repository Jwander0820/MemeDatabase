# 頁面與靜態資源共用的安全標頭；由 Dockerfile.nginx 複製到 /etc/nginx/snippets/。
# Nginx 的 add_header 只要 location 內自己有 add_header 就不會繼承上層，所以每個有 add_header 的 location 都要 include 這份。
# CSP：頁面沒有 inline script 或 style 屬性（tests/test_admin_hardening.py 檢查）；
# 外部原圖（R2 或手填網址）只允許 https，供顯示（img）與複製／下載時的 fetch（connect）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
